name: Deploy Followup Frontend (Alpha)

on:
  push:
    branches:
      - alpha
    paths:
      - 'src/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'web.config'
      - '.github/workflows/alpha_alpha-followupcare.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20.x'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_INSIGHTS_CONNECTION_STRING: ${{ secrets.APP_INSIGHTS_CONNECTION_STRING }}
  APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}

concurrency:
  group: alpha-followupcare
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build alpha bundle
        run: npm run "build alpha"

      - name: Stage web.config for App Service
        run: cp web.config dist/web.config

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v5
        with:
          name: followup-frontend-dist
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: alpha
    permissions:
      id-token: write
      contents: read
    env:
      PUBLISH_PROFILE_PRIMARY: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
      PUBLISH_PROFILE_FALLBACK: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      PUBLISH_PROFILE_LEGACY: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_16E4C871F9C144DA9788C2DB4A7A44C2 }}
      AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_16E4C871F9C144DA9788C2DB4A7A44C2 }}
      AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_72C263F8B60B4EDFA4D84B534A7C76D7 }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2FB1AC18608D4EC9A035370A370AE149 }}

    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v5
        with:
          name: followup-frontend-dist
          path: .

      - name: Validate deploy package layout
        run: |
          echo "Checking downloaded artifact layout"
          ls -la
          if [ -f dist/web.config ] && [ -f dist/index.html ]; then
            echo "Artifact layout detected: dist folder"
            echo "ARTIFACT_SOURCE=dist" >> "$GITHUB_ENV"
          elif [ -f web.config ] && [ -f index.html ]; then
            echo "Artifact layout detected: flat root"
            echo "ARTIFACT_SOURCE=." >> "$GITHUB_ENV"
          else
            echo "Could not find expected web assets in dist/ or root"
            find . -maxdepth 4 -name web.config -print
            find . -maxdepth 4 -name index.html -print
            exit 1
          fi

      - name: Build zip-deploy payload with top-level dist folder
        run: |
          rm -rf deploy
          mkdir -p deploy/dist
          if [ "$ARTIFACT_SOURCE" = "dist" ]; then
            cp -R dist/. deploy/dist/
          else
            find . -mindepth 1 -maxdepth 1 ! -name deploy -exec cp -R {} deploy/dist/ \;
          fi
          test -f deploy/dist/web.config
          test -f deploy/dist/index.html

      - name: Resolve deploy auth mode
        id: auth_mode
        run: |
          if [ -n "$PUBLISH_PROFILE_PRIMARY" ] || [ -n "$PUBLISH_PROFILE_FALLBACK" ] || [ -n "$PUBLISH_PROFILE_LEGACY" ]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Missing frontend deployment credentials. Configure either publish profile secrets (AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND, AZURE_WEBAPP_PUBLISH_PROFILE, or AZUREAPPSERVICE_PUBLISHPROFILE_16E4C871F9C144DA9788C2DB4A7A44C2) or OIDC secrets (AZUREAPPSERVICE_CLIENTID_16E4C871F9C144DA9788C2DB4A7A44C2, AZUREAPPSERVICE_TENANTID_72C263F8B60B4EDFA4D84B534A7C76D7, AZUREAPPSERVICE_SUBSCRIPTIONID_2FB1AC18608D4EC9A035370A370AE149)."
            exit 1
          fi

      - name: Login to Azure (OIDC)
        if: steps.auth_mode.outputs.mode == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (Publish Profile)
        if: steps.auth_mode.outputs.mode == 'publish'
        id: deploy-to-webapp
        env:
          NODE_NO_WARNINGS: '1'
        uses: azure/webapps-deploy@v3
        with:
          app-name: alpha-followupcare
          slot-name: Production
          publish-profile: ${{ env.PUBLISH_PROFILE_PRIMARY != '' && env.PUBLISH_PROFILE_PRIMARY || (env.PUBLISH_PROFILE_FALLBACK != '' && env.PUBLISH_PROFILE_FALLBACK || env.PUBLISH_PROFILE_LEGACY) }}
          package: deploy

      - name: Deploy to Azure Web App (OIDC)
        if: steps.auth_mode.outputs.mode == 'oidc'
        id: deploy-to-webapp-oidc
        env:
          NODE_NO_WARNINGS: '1'
        uses: azure/webapps-deploy@v3
        with:
          app-name: alpha-followupcare
          slot-name: Production
          package: deploy
