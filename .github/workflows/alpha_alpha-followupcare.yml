name: Deploy Followup Frontend (Alpha)

on:
  push:
    branches:
      - alpha
    paths:
      - 'src/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'web.config'
      - '.github/workflows/alpha_alpha-followupcare.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20.x'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: alpha-followupcare
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build alpha bundle
        run: npm run "build alpha"

      - name: Stage web.config for App Service
        run: cp web.config dist/web.config

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v5
        with:
          name: followup-frontend-dist
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: alpha
    env:
      PUBLISH_PROFILE_PRIMARY: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
      PUBLISH_PROFILE_FALLBACK: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      PUBLISH_PROFILE_LEGACY: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_16E4C871F9C144DA9788C2DB4A7A44C2 }}

    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v5
        with:
          name: followup-frontend-dist
          path: dist

      - name: Verify publish profile secret
        run: |
          if [ -z "$PUBLISH_PROFILE_PRIMARY" ] && [ -z "$PUBLISH_PROFILE_FALLBACK" ] && [ -z "$PUBLISH_PROFILE_LEGACY" ]; then
            echo "Missing frontend publish profile secret. Set AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND (preferred), AZURE_WEBAPP_PUBLISH_PROFILE, or AZUREAPPSERVICE_PUBLISHPROFILE_16E4C871F9C144DA9788C2DB4A7A44C2."
            exit 1
          fi

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: alpha-followupcare
          slot-name: Production
          publish-profile: ${{ env.PUBLISH_PROFILE_PRIMARY != '' && env.PUBLISH_PROFILE_PRIMARY || (env.PUBLISH_PROFILE_FALLBACK != '' && env.PUBLISH_PROFILE_FALLBACK || env.PUBLISH_PROFILE_LEGACY) }}
          package: dist
