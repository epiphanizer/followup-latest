name: Deploy Followup Frontend (Alpha)

on:
  push:
    branches:
      - alpha
    paths:
      - 'src/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'web.config'
      - '.github/workflows/alpha_alpha-followupcare.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20.x'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: alpha-followupcare
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build alpha bundle
        run: npm run "build alpha"

      - name: Stage web.config for App Service
        run: cp web.config dist/web.config

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: followup-frontend-dist
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: alpha
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: followup-frontend-dist
          path: dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_16E4C871F9C144DA9788C2DB4A7A44C2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_72C263F8B60B4EDFA4D84B534A7C76D7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2FB1AC18608D4EC9A035370A370AE149 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: alpha-followupcare
          slot-name: Production
          package: dist
