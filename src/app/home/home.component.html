<div class="user-dashboard">
  <div class="message-container">
    <h1>Hello {{ user.userFirstName }}</h1>

    <div class="team-notes">
      <h2>
        {{ teamNote.teamNoteSubject }}
      </h2>
      <div class="team-message">
        {{ teamNote.teamNoteMessage }}
      </div>
    </div>

    <div class="posted-notes">
      <ul class="user-messages">
        <li class="user-message-note" *ngFor="let message of user.userMessages">
          <p class="user-message">
            {{ message.messageBody }}
          </p>
          <span class="from-sender">-{{ message.messageSenderFirstName }}</span>
        </li>
      </ul>
      <jw-pagination *ngIf="user.userMessages" [items]="user.userMessages" [pageSize]="3"></jw-pagination>
    </div>
  </div>
  <div class="everybody-is-callout">
    <img src="/assets/everybody-graphic@2x.png" alt="" />
  </div>
</div>
