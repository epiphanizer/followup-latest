<div class="user-dashboard">
  <h3>Hello {{ user.userFirstName }}</h3>

  <div class="team-notes">
    Most Recent Team Notes Here
  </div>

  <div class="posted-notes">
    <ul>
      <li *ngFor="messages; of: user.userMessages"></li>
    </ul>
    <jw-pagination
      *ngIf="user.userMessages"
      [items]="user.userMessages"
      (changePage)="onChangePage($event)"
    ></jw-pagination>
  </div>

  <div class="everybody-is-callout">
    Everybody is a somebody.
  </div>
</div>
