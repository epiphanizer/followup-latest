<div class="user-dashboard">
  <ion-grid>
    <ion-row>
      <ion-col class="left-box">
        <div class="message-container">
          <h1>Hello {{ user.userFirstName }}</h1>

          <div class="team-messages">
            <div class="team-message">
              {{ teamMessage.teamMessageContent }}
            </div>
          </div>
        </div>
      </ion-col>
      <ion-col class="post-it-box">
        <div class="posted-notes">
          <ul class="user-messages">
            <li class="user-message-note">
              <div class="user-message-body">
                <p class="user-message">
                  {{ userMessagesPage.messageBody }}
                </p>
                <span class="from-sender">-{{ userMessagesPage.messageSenderFirstName }}</span>
              </div>
            </li>
          </ul>
          <jw-pagination *ngIf="user.userMessages" [items]="user.userMessages" [pageSize]="1"></jw-pagination>
        </div>
      </ion-col>
      <ion-col class="confetti-box"></ion-col>
    </ion-row>
    <ion-row>
      <ion-col class="patient-pipeline"></ion-col>
      <ion-col class="red-data-box"></ion-col>
      <ion-col class="green-data-box"></ion-col>
    </ion-row>
  </ion-grid>
  <div class="everybody-is-callout">
    <img src="/assets/everybody-graphic@2x.png" alt="" />
  </div>
</div>
