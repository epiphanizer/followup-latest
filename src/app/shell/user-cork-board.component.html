<div class="user-cork-board" [@openClose]="isOpen ? 'open' : 'closed'">
  <div class="container">
    <div class="row">
      <ul class="corkboard-controls">
        <li (click)="toggleCorkboardState()" class="expand icon"></li>
        <li (click)="addNewCorkboardItem()" class="new-item icon">
          +
        </li>
        <li (click)="deleteCorkboardItem()" class="minus icon">
          -
        </li>
      </ul>
    </div>
  </div>
</div>
