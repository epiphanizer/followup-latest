<div class="toolbar-profile-nav">
  <div class="user-avatar">
    <div class="avatar-image">
      <a routerLink="/user/profile" class="user-profile-jump">
        <div
          class="user-avatar-image"
          *ngIf="avatarExists; else defaultAvatar"
          [style.background-image]="avatarUrl"
        ></div>
        <ng-template #defaultAvatar>
          <img src="/assets/default-avatar-patient-detail.png" />
        </ng-template>
      </a>
    </div>
  </div>
  <div class="username">
    <a routerLink="/user/profile" class="user-profile-jump">
      <span *ngIf="user.userFirstName && user.userLastName && user.userLastName !== 'User'; else newUser">
        {{ user.userFirstName }} {{ user.userLastName.charAt(0) }}.
      </span>
      <ng-template #newUser>
        New User
      </ng-template>
    </a>
  </div>
  <div class="logout-nav">
    <a routerLink="/login" (click)="signOut()">[logout]</a>
  </div>
</div>
