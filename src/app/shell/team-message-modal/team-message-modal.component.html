<ng-container>
  <form *ngIf="createTeamMessageForm" [formGroup]="createTeamMessageForm">
    <ion-row *ngIf="teamMessage" class="team-message-container">
      <ion-title>Post Team Message</ion-title>
      <img class="post-it-icon-image" src="/assets/icon-postit-lg@2x.png" alt="" />
    </ion-row>
    <span class="message-to-label"><strong>To:</strong> All Team</span>
    <span class="message-label"><strong>Message:</strong></span>
    <ion-textarea
      [autoGrow]="true"
      class="team-message-textarea"
      formControlName="teamMessageContent"
      placeholder="Leave Your Message Here"
    ></ion-textarea>
    <div class="button-container">
      <ion-button class="cancel-button" type="button" (click)="dismiss()">Cancel </ion-button>
      <ion-button
        [disabled]="createTeamMessageForm.invalid"
        class="save-button"
        type="button"
        (click)="sendTheMessage()"
        >Send
      </ion-button>
    </div>
  </form>
</ng-container>
