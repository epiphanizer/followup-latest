<div class="modal-exit-container ">
  <i (click)="dismiss()" class="icon-close-modal"></i>
</div>
<ion-row>
  <ion-title class="ion-float-left">Kudos</ion-title>
  <h3 class="notification-title ion-float-right">
    KUDOS
  </h3>
  <img class="kudos-stars ion-float-right" src="/assets/icon-notification-kudos@2x.png" alt="" />
</ion-row>
<ion-row>
  <ion-col class="left-col">
    <div class="sidebar-calendar">
      <h4>TODAY'S DATE</h4>
      <div class="caption">
        {{ todaysDateDay }}
      </div>
    </div>
  </ion-col>
  <ion-col class="right-col">
    <form *ngIf="createNotificationForm" [formGroup]="createNotificationForm">
      <ion-list class="review-notification-list" lines="none" inset>
        <ion-item class="notification-review-item">
          <span class="label">Patient:&nbsp;</span>
          {{ notification.notificationPatientFirstName }}
          {{ notification.notificationPatientLastName }}
        </ion-item>
        <ion-item class="notification-review-item">
          <span class="label">Facility:&nbsp;</span>
          {{ notification.notificationOperationName }}
        </ion-item>
        <ion-item class="notification-review-item">
          <span class="label">Date Received:&nbsp;</span> {{ todaysDate }}
        </ion-item>
        <span class="textarea-label label">Message:&nbsp;</span>
        <ion-item class="textarea-item">
          <ion-textarea formControlName="notificationMessage" placeholder="Give your kudos!"></ion-textarea>
        </ion-item>
      </ion-list>
    </form>
  </ion-col>
</ion-row>
<ion-row>
  <div class="send-container">
    <ion-button
      class="ion-float-right send-button"
      [disabled]="createNotificationForm.invalid"
      (click)="sendNotification()"
      >Send</ion-button
    >
  </div>
</ion-row>
