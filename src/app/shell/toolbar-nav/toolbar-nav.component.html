<nav [class.dropdown-active]="dropdownActivated" *ngIf="user && navLinks" (mouseleave)="closeDropdowns()">
  <div class="nav-list">
    <div class="nav-link-container" *ngFor="let link of navLinks; let i = index">
      <div class="nav-link-row" *ngIf="link.minRole >= getUserRoleValue(user)">
        <a
          *ngIf="!link.dropdown && !link.dynamic"
          class="nav-link"
          (click)="closeDropdowns()"
          [routerLink]="link.linkAction"
        >
          <i *ngIf="link.linkIcon" class="{{ link.linkIcon }}"></i>
          {{ link.linkName }}
        </a>
        <button
          *ngIf="link.dropdown"
          type="button"
          class="nav-link nav-trigger"
          (mouseenter)="openDropdown(i)"
          (focus)="openDropdown(i)"
          (click)="toggleDropdown(i, $event)"
        >
          <i *ngIf="link.linkIcon" class="{{ link.linkIcon }}"></i>
          <span>{{ link.linkName }}</span>
          <i class="nav-caret"></i>
        </button>
        <button
          *ngIf="!link.dropdown && link.dynamic"
          type="button"
          class="nav-link nav-action"
          [class.disabled]="!callQueuePage"
          (click)="dynamicLink(link)"
        >
          <i *ngIf="link.linkIcon" class="{{ link.linkIcon }}"></i>
          {{ link.linkName }}
        </button>
      </div>
      <div *ngIf="dropdowns[i] && link.dropdown">
        <div
          [class.active]="dropdowns[i].activated"
          class="dropdown"
          (mouseenter)="openDropdown(i)"
          (mouseleave)="closeDropdown(i)"
        >
          <ul *ngIf="link.minRole >= getUserRoleValue(user)">
            <li *ngFor="let childLink of link.dropdown.links">
              <a
                *ngIf="!childLink.dynamic && (childLink.minRole || link.minRole) >= getUserRoleValue(user)"
                (click)="closeDropdowns()"
                [routerLink]="childLink.linkAction"
              >
                {{ childLink.linkName }}</a
              >
              <button
                *ngIf="childLink.dynamic && (childLink.minRole || link.minRole) >= getUserRoleValue(user)"
                type="button"
                class="dropdown-action"
                (click)="dynamicLink(childLink)"
              >
                {{ childLink.linkName }}
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>
