<ng-container *ngIf="navLinks">
  <ion-list lines="none">
    <div class="nav-link-container" *ngFor="let link of navLinks; let i = index">
      <ion-item>
        <a *ngIf="!link.dropdown.links" routerLink="/{{ link.linkAction }}">
          <i *ngIf="link.linkIcon" class="{{ link.linkIcon }}"></i>
          {{ link.linkName }}
        </a>
        <a *ngIf="link.dropdown.links" (mouseover)="toggleDropdown(i, $event)" (mouseout)="toggleDropdown(i, $event)">
          <i *ngIf="link.linkIcon" class="{{ link.linkIcon }}"></i>
          <a routerLink="/{{ link.linkAction }}">{{ link.linkName }} </a>
        </a>
      </ion-item>
      <div *ngIf="dropdowns[i]">
        <div [class.active]="dropdowns[i].activated" class="dropdown" *ngIf="link.dropdown.links">
          <ul *ngIf="link.minRole >= user.userLevel">
            <li *ngFor="let link of link.dropdown.links">
              <a (click)="closeDropdown(i)" routerLink="/{{ link.linkAction }}"> {{ link.linkName }}</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </ion-list>
</ng-container>
