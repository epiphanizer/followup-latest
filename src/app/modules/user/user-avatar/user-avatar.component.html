<div (click)="uploadUserAvatarPhoto()">
  <div class="photo-frame">
    <div class="user-avatar-image" [style.background-image]="avatarUrl"></div>
  </div>
</div>
<div class="form-group">
  <button class="secondary button" [class.hidden]="teamProfile" (click)="uploadUserAvatarPhoto()">
    <span *ngIf="!avatarExists">Add Photo</span>
    <span *ngIf="avatarExists">Change Photo</span>
  </button>
</div>
