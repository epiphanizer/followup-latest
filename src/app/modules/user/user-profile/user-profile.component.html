<ion-row>
  <ion-col class="user-profile-sidebar">
    <!-- <app-admin-sidebar> 

      </app-admin-sidebar> -->
  </ion-col>
  <ion-col class="user-profile-content">
    <ion-title>User Profile</ion-title>
    <form id="user-profile-form" (ngSubmit)="updateUserProfile()" [formGroup]="userProfileForm" novalidate>
      <ion-list lines="none">
        <ion-item class="first-name">
          <ion-label color="medium" position="stacked">First Name</ion-label>
          <ion-input type="text" formControlName="userFirstName"></ion-input>
        </ion-item>
        <ion-item class="middle-name">
          <ion-label color="medium" position="stacked">Middle Name</ion-label>
          <ion-input type="text" formControlName="userMiddleName"></ion-input>
        </ion-item>
        <ion-item class="last-name">
          <ion-label color="medium" position="stacked">Last Name</ion-label>
          <ion-input type="text" formControlName="userLastName"></ion-input>
        </ion-item>
        <ion-item class="user-email">
          <ion-label color="medium" position="stacked">Email</ion-label>
          <ion-input type="email" formControlName="userEmail"></ion-input>
        </ion-item>
        <ion-item class="user-phone-container">
          <ion-item class="user-phone-country-code">
            <ion-label color="medium" position="stacked">Country Code</ion-label>
            <ion-input type="text" formControlName="userPhoneCountryCode"></ion-input>
          </ion-item>
          <ion-item class="user-phone-area-code">
            <ion-label color="medium" position="stacked">Phone Area Code</ion-label>
            <ion-input type="text" formControlName="userPhoneAreaCode"></ion-input>
          </ion-item>
          <ion-item class="user-phone-number">
            <ion-label color="medium" position="stacked">Phone Number</ion-label>
            <ion-input type="text" formControlName="userPhone"></ion-input>
          </ion-item>
        </ion-item>
      </ion-list>
      <ion-list lines="none">
        <i class="icon-lock"></i>
        <ion-item>
          <ion-label color="medium" position="stacked">Password</ion-label>
          <ion-input type="password" formControlName="userPassword"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label color="medium" position="stacked">Confirm Password</ion-label>
          <ion-input type="password" formControlName="userConfirmPassword"></ion-input>
        </ion-item>
      </ion-list>
