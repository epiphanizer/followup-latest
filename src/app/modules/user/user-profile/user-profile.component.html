<ion-row>
  <ion-col class="user-profile-sidebar">
    <!-- <app-admin-sidebar> 

      </app-admin-sidebar> -->
  </ion-col>
  <ion-col class="call-queue-content">
    <ion-title>User Profile</ion-title>
    <form id="user-profile-form" (ngSubmit)="updateUserProfile()" [formGroup]="userProfileForm" novalidate>
      <ion-list no-lines>
        <ion-item>
          <ion-label color="medium" position="floating">First Name</ion-label>
          <ion-input type="text" formControlName="userFirstName"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label color="medium" position="floating">Middle Name</ion-label>
          <ion-input type="text" formControlName="userMiddleName"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label color="medium" position="floating">Last Name</ion-label>
          <ion-input type="text" formControlName="userLastName"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label color="medium" position="floating">Email</ion-label>
          <ion-input type="email" formControlName="userEmail"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label color="medium" position="floating">Phone #</ion-label>
          <ion-input type="text" formControlName="userPhone"></ion-input>
        </ion-item>
      </ion-list>
    </form>
  </ion-col>
  <ion-col class="call-queue-content">
    <!-- <app-user-avatar></app-user-avatar> -->
  </ion-col>
</ion-row>
