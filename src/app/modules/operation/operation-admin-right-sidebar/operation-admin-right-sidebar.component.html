<div class="sidebar" lines="none" inset>
  <ion-item>
    <h3 class="headline"><i class="icon-team"></i> Team Members</h3>
    <i
      class="expand-users-assigned-trigger"
      (click)="toggleOperationUsersAssignedMenu()"
      [@turnArrow]="isOpen ? 'open' : 'closed'"
      class="expand-users-assigned-trigger active"
    ></i>
  </ion-item>
  <fieldset class="operation-team-members" formArray="operationManagers">
    <span class="section-label">
      Assigned Managers
    </span>
    <ion-list class="assigned-manager-list" *ngIf="operationAssignedManagers" lines="none">
      <ng-container *ngFor="let operationManager of operationAssignedManagers; let idx = index">
        <ion-item id="operation-manager-{{ idx }}">
          <ion-select
            *ngIf="mode.edit; else managerSpan"
            (ionChange)="managerOnSelect($event, idx)"
            class="operation-assigned-manager"
            placeholder="Assign Manager"
          >
            <ion-select-option
              *ngFor="let user of availableUsers"
              [selected]="user.userId == operationManager.userId"
              [value]="user.userId"
            >
              {{ user.userLastName }}, {{ user.userFirstName }}
            </ion-select-option>
          </ion-select>
          <ng-template #managerSpan>
            <span> {{ user.userLastName }}, {{ user.userFirstName }} </span>
          </ng-template>
        </ion-item>
      </ng-container>
    </ion-list>
  </fieldset>
  <fieldset class="operation-callreps">
    <ng-container>
      <span class="section-label">
        Assigned Care Reps
      </span>
      <ion-list class="assigned-callrep-list" lines="none" inset>
        <ng-container *ngFor="let operationCallRep of operationAssignedUsers; let idx = index">
          <ion-item id="operationCallRep-{{ idx }}">
            <ion-select
              *ngIf="availableUsers && mode.edit; else memberSpan"
              (ionChange)="callRepOnSelect($event, idx)"
              placeholder="Select User"
            >
              <ion-select-option
                *ngFor="let user of availableUsers"
                [value]="user.userId"
                [selected]="user.userId == operationCallRep.userId"
              >
                {{ user.userLastName }}, {{ user.userFirstName }}
              </ion-select-option>
            </ion-select>
            <ng-template #memberSpan>
              <span> {{ user.userLastName }}, {{ user.userFirstName }} </span>
            </ng-template>
          </ion-item>
        </ng-container>
        <div class="controls">
          <a href="" *ngIf="mode.add || mode.edit" class="add-members" (click)="addAdditionalOperationCallRep()"
            >+ Team Members</a
          >
        </div>
      </ion-list>
    </ng-container>
  </fieldset>
</div>
