<div class="operation-sidebar" *ngIf="user">
  <div class="sidebar-calendar">
    <h4 class="todays-date">TODAY'S DATE</h4>
    <div class="caption">
      {{ todaysDateDay }}
    </div>
  </div>
  <div class="facility-dropdown-container">
    <a class="facility-dropdown-target">{{ groupNavigationLabel }}</a>
    <div class="client-filter-toggle" *ngIf="clientMode">
      <button
        type="button"
        class="client-filter-button"
        [class.active]="clientFilter === 'active'"
        (click)="setClientFilter('active')"
      >
        Active ({{ clientCounts.active }})
      </button>
      <button
        type="button"
        class="client-filter-button"
        [class.active]="clientFilter === 'archived'"
        (click)="setClientFilter('archived')"
      >
        Archived ({{ clientCounts.archived }})
      </button>
    </div>
    <ng-container *ngIf="operationGroups">
      <div
        class="operation-group-container"
        *ngFor="let operationGroup of visibleOperationGroups; let i = index; trackBy: trackByOperationGroup"
      >
        <span class="operation-group"
          ><a
            class="operation-group-link"
            [class.active]="isOperationGroupActive(operationGroup)"
            (click)="handleOperationGroupClick(operationGroup, $event)"
            [routerLink]="getOperationGroupRoute(operationGroup)"
            >{{
              operationGroup.operationGroupShortName?.length
                ? operationGroup.operationGroupShortName
                : operationGroup.operationGroupName
            }}</a
          >
          <i
            *ngIf="!clientMode"
            class="expand-facilities-trigger"
            [@turnArrow]="isOperationGroupExpanded(operationGroup) ? 'open' : 'closed'"
            (click)="toggleOperationSidebarMenu(operationGroup, $event)"
          >
          </i>
          <button
            *ngIf="clientMode && operationGroup.operationGroupActive === 0"
            type="button"
            class="client-restore-inline"
            [disabled]="isClientRestoreInFlight(operationGroup)"
            (click)="restoreClient(operationGroup, $event)"
          >
            {{ isClientRestoreInFlight(operationGroup) ? 'Restoring...' : 'Restore' }}
          </button>
          <ul
            class="group-operations"
            [class.show]="isOperationGroupExpanded(operationGroup)"
            *ngIf="!clientMode && operationGroup.operations"
          >
            <li
              *ngFor="let operation of operationGroup.operations; trackBy: trackByOperation"
              [class.spanish]="operation.spanishSpeaking"
            >
              <div class="operation-link-container" *ngIf="operation.operationActive">
                <a
                  class="operation-link"
                  [routerLink]="'/operation/' + operation.operationId"
                  (click)="setActiveOperation(operation)"
                  [class.active]="activeOperationId == operation.operationId"
                >
                  {{ operation.operationName | slice: 0:15
                  }}<span *ngIf="operation.operationName.length > 16">
                    <!-- ... -->
                  </span>
                </a>

                <span class="current-patients">
                  {{ operation.currentAssignedPatientCount }}
                </span>
              </div>
            </li>
          </ul>
        </span>
      </div>
    </ng-container>
  </div>
</div>
