<div class="call-queue-sidebar">

    <h4>TODAY'S DATE</h4>
    <div class="caption">28</div>
  </div>

  <a class="facility-dropdown-target">MY FACILITIES</a>
  <i class="expand-facilities-trigger" (click)="toggleOperationSidebarMenu()"></i>

  </ul>
</div>
