<div class="call-queue-sidebar">
  <div class="call-queue-sidebar-calendar">
    <h4>TODAY'S DATE</h4>
    <div class="caption">
      {{ todaysDateDay }}
    </div>
  </div>

  <a class="facility-dropdown-target" (click)="toggleOperationSidebarMenu()">MY FACILITIES</a>
  <i
    class="expand-facilities-trigger"
    (click)="toggleOperationSidebarMenu()"
    [@turnArrow]="isOpen ? 'open' : 'closed'"
    class="expand-facilities-trigger active"
  ></i>
  <ul
    class="facility-dropdown-list"
    [@expandSidebar]="isOpen ? 'open' : 'closed'"
    class="facility-dropdown-list active"
    *ngIf="operations; else noOperations"
  >
    <li *ngFor="let operation of operations; let i = index">
      <ng-container *ngIf="operation.currentAssignedPatientCount > 0">
        <a (click)="setActiveOperation(operation)" [ngClass]="{ active: selected.operation == operation }">
          {{ operation.operationName }}
          <span class="icon-patient-counter"> [{{ operation.currentAssignedPatientCount }}] </span>
        </a>
        <ng-container *ngIf="operation.todaysCalls > 0">
          <i class="icon-todays-calls"></i>
          <span class="icon-todays-calls-counter">
            {{ operation.todaysScheduledCalls }}
          </span>
        </ng-container>
        <ng-container *ngIf="operation.currentNewDischargeCount > 0">
          <i class="icon-new-discharges"></i>
          <span class="icon-discharge-counter">
            {{ operation.currentNewDischargeCount }}
          </span>
        </ng-container>
      </ng-container>
    </li>
  </ul>
  <ng-template #noOperations>
    You haven't been assigned any operations yet!
  </ng-template>
</div>
