<h3 class="section-header">
  <i class="icon-new-discharges" *ngIf="operation.currentNewDischargeCount"> </i>
  <span class="operation-discharges">
    {{ operation.currentNewDischargeCount }}
  </span>
  {{ operation.operationName }}
</h3>
<ion-item-divider class="divider-line"></ion-item-divider>
<ul class="patient-filters">
  <li>
    <a [class.active]="filterBy == 'discharge-date'" (click)="sortPatientsByDischargeDate(selectedSortFlag)"
      >[Discharge Date]</a
    >
  </li>
  <li>
    <a [class.active]="filterBy == 'call-date'" (click)="sortPatientsByCallDate(selectedSortFlag)">[Call Date]</a>
  </li>
  <li class="ascending-descending-control">
    <i
      class="ascending-descending-control-arrow"
      [class.asc]="selectedSortFlag == 'asc'"
      [class.desc]="selectedSortFlag == 'desc'"
      (click)="toggleAscDesc()"
    >
    </i>
  </li>
</ul>
<ul class="call-queue-patient-list">
  <li
    *ngFor="let patient of patients$ | async"
    class="active"
    [class.new-discharge]="patient.patientCallCount == 1"
    [routerLink]="'/call-queue/operations/' + operation.operationId + '/patient/' + patient.patientId"
  >
    <ng-container *ngIf="patient.patientOnFinalCall; else patientCallCount">
      <div class="call-queue-number">
        <img src="/assets/icon-final-call@2x.png" />
      </div>
    </ng-container>
    <ng-template #patientCallCount>
      <div class="call-queue-number">
        {{ patient.patientCallCount }}
      </div>
    </ng-template>

    <div class="call-queue-avatar">
      <app-patient-avatar [patient]="patient"></app-patient-avatar>
    </div>
    <div class="call-queue-patient-information">
      <span class="call-queue-patient-name">
        <a [routerLink]="'/call-queue/operations/' + operation.operationId + '/patient/' + patient.patientId">
          {{ patient.patientFirstName }} {{ patient.patientLastName }}
        </a>
      </span>
      <span class="patient label-line"> {{ patient.patientAge }}, {{ operation?.operationName }} </span>
    </div>
    <div class="call-queue-call-status-legend">
      <ion-list *ngIf="patient.patientCallCount > 1" inset lines="none">
        <ion-item *ngFor="let patientCallStatus of patientCallStatuses">
          <i
            class="icon-{{ patientCallStatus.patientCallStatusLabel.replace(' ', '-') | lowercase }}"
            [class.active]="patient.lastPatientCallStatusLabelId == patientCallStatus.patientCallStatusLabelId"
          >
          </i>
        </ion-item>
      </ion-list>
    </div>
  </li>
</ul>
