<div class="patient-filter">
  <ion-row>
    <ion-col col-auto>
      <table>
        <tr>
          <td>
            <ion-input placeholder="Patient/Date Search" (ionInput)="searchPatientCallHistoryByText($event)">
            </ion-input>
          </td>
          <td>
            <ion-icon name="search"></ion-icon>
          </td>
        </tr>
      </table>
    </ion-col>
  </ion-row>
  <ng-container class="patient-filter-results" *ngIf="patientCalls; else isLoading">
    <ion-list lines="none" inset>
      <ion-item class="patient-call-filter-listing" *ngFor="let patientCall of patientCallsFiltered">
        <span class="patient-filter-patient-name"
          >{{ patientCall.patientFirstName }} {{ patientCall.patientLastName }} -
        </span>
        <span class="patient-filter-call-date"
          >Call {{ patientCall.patientCallNumber }} ({{ patientCall.patientCallStatusLabel }})</span
        >
      </ion-item>
    </ion-list>
  </ng-container>
</div>
<ng-template #isLoading>
  <span class="font-style:italic; font-weight:12px; font-family:Avenir; margin:18px;">Loading...</span>
</ng-template>
