<div class="patient-filter">
  <ion-row>
    <ion-col col-auto>
      <table>
        <tr>
          <td>
            <ion-input placeholder="Patient/Date Search"> </ion-input>
          </td>
          <td>
            <ion-icon name="search"></ion-icon>
          </td>
        </tr>
      </table>
    </ion-col>
  </ion-row>
  <div class="patient-filter-results">
    <ul *ngIf="user?.patients; else #noCalls">
      <li><span>date or name</span></li>
      <li><span>date or name</span></li>
    </ul>
    <ng-template #noCalls>
      No calls have been made yet! Let's get rolling!
    </ng-template>
  </div>
</div>
