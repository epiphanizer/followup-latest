<div class="patient-filter">
  <ion-row>
    <ion-col col-auto>
      <table>
        <tr>
          <td>
            <ion-input placeholder="Patient/Date Search" (submit)="searchPatientCallHistory()"> </ion-input>
          </td>
          <td>
            <ion-icon name="search"></ion-icon>
          </td>
        </tr>
      </table>
    </ion-col>
  </ion-row>
  <div class="patient-filter-results">
    <ul>
      <li *ngFor="let patientCall of userPatientCalls$ | async">
        <span>{{ patientCall.patientName }}</span>
      </li>
    </ul>
  </div>
</div>
