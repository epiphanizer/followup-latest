<div class="patient-filter">
  <ion-row>
    <ion-col col-auto>
      <table>
        <tr>
          <td>
            <ion-input placeholder="Patient/Date Search" (submit)="searchPatientCallHistory()"> </ion-input>
          </td>
          <td>
            <ion-icon name="search"></ion-icon>
          </td>
        </tr>
      </table>
    </ion-col>
  </ion-row>
  <ng-container class="patient-filter-results" *ngIf="userPatientCalls$ | async as patientCalls">
    <ul>
      <li *ngFor="let patientCall of patientCalls">
        <span>{{ patientCall }}</span>
      </li>
    </ul>
  </ng-container>
</div>
