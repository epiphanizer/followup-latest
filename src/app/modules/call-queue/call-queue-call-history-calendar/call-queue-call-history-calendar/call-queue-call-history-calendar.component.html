<div class="call-history-container">
  <h3>Call History</h3>
  <ion-item-divider class="divider-line"></ion-item-divider>
  <div class="calendar-month-controls">
    <span class="left-month-arrow" (click)="calendarPrevMonth()"></span>
    <span class="calendar-month">
      {{ currentMonth.name }}
    </span>
    <span class="right-month-arrow" (click)="calendarNextMonth()"></span>
  </div>
  <div class="calendar-days">
    <ion-list class="calendar-days" inset lines="none">
      <ion-item class="calendar-block" *ngFor="let day of selectedMonth.daysArray">
        {{ day }}
      </ion-item>
    </ion-list>
  </div>
</div>
