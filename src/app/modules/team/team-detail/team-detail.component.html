<ion-content>
  <ion-row>
    <ion-col class="team-sidebar">
      <app-team-listing-sidebar (teamMemberChangeEvent)="teamMemberChangeEventHandler($event)">
      </app-team-listing-sidebar>
    </ion-col>
    <ion-col class="team-content-wrapper">
      <ion-title class="ion-float-left">
        Team Members
      </ion-title>
      <!--       
      <div class="user-avatar" *ngIf="selected.user">
        <app-user-avatar [user]="user"></app-user-avatar>
        <div class="user-info-container">
          <div class="user-email" *ngIf="user.userEmail">
            {{ user.userEmail }}
          </div>
          <div class="user-phone" *ngIf="user.userPhoneNumber"></div>
        </div>
      </div> -->

      <div class="team-member-info-container">
        <div class="team-member-info-container" *ngIf="teamMember">
          <div class="user-info">
            <span class="post-it-note"><i class="post-it"></i> <a (click)="postNote(teamMember)">Post a note</a></span>
            <div class="greeting">
              <span *ngIf="!teamMember.languages.spanish; else spanish">
                Hello my name is...
              </span>
              <ng-template #spanish>
                Hola! Mi nombre es...
              </ng-template>
            </div>
            <div class="user-name">
              <h2 class="user-name">
                {{ teamMember.teamMemberFirstName }}
                {{ teamMember.teamMemberLastName }}
              </h2>
            </div>
          </div>
          <div class="user-information">
            {{ teamMember.needToKnow }}
          </div>
          <!-- <p>
            <ul class="user-interests"> 
            <li *ngFor="let userInterest of user.userInterests">
                {{ userInterest }}
              </li>
            </ul>
          </p> -->
        </div>
      </div>
    </ion-col>
  </ion-row>
</ion-content>
