<div class="team-sidebar">
  <div class="team-sidebar-calendar">
    <h4 class="todays-date">TODAY'S DATE</h4>
    <div class="caption">
      {{ todaysDateDay }}
    </div>
  </div>

  <div class="team-dropdown-container">
    <a class="team-dropdown-target">THE TEAM</a>
    <div class="team-member-container">
      <span class="sidebar-label"
        >MANAGERS
        <i class="expand-members-trigger"> </i>
      </span>
      <ul class="team-members-list">
        <li *ngFor="let teamMember of managerTeamMembers">
          <a [routerLink]="'/team/members/' + teamMember.userTeamId" class="team-member-link">
            {{ teamMember.teamMemberFirstName }} {{ teamMember.teamMemberLastName }}
          </a>
        </li>
      </ul>
    </div>
    <div class="team-member-container">
      <span class="sidebar-label"
        >CARE REPS
        <i class="expand-members-trigger"> </i>
      </span>
      <ul class="team-members-list">
        <li *ngFor="let teamMember of careRepTeamMembers">
          <a [routerLink]="'/team/members/' + teamMember.teamMemberTeamId" class="team-member-link">
            {{ teamMember.teamMemberFirstName }} {{ teamMember.teamMemberLastName }}
          </a>
        </li>
      </ul>
    </div>
    <div class="team-member-container">
      <span class="sidebar-label"
        >SPANISH
        <i class="expand-members-trigger"> </i>
      </span>
      <ul class="team-members-list">
        <li *ngFor="let teamMember of spanishSpeakingTeamMembers">
          <a [routerLink]="'/team/members/' + teamMember.teamMemberTeamId" class="team-member-link">
            {{ teamMember.userFirstName }} {{ teamMember.userLastName }}
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>
