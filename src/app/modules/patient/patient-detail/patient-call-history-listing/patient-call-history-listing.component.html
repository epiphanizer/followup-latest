<ng-container *ngIf="patientCalls; else noPatientCalls">
  <ul>
    <li>
      <div class="call-headline-container"><i class="phone-icon"></i> {{ patientCall.number }}</div>
      <div class="call-question-container">
        <!-- Defaults get treated differently / with icons -->
      </div>
      <div class="custom-call-question-container">
        <ul>
          <!-- <li *ngFor="let patientCallQuestion of patientCallQuestions$; | async">
            {{patientCallQuestion}};
          </li> -->
        </ul>
      </div>
    </li>
  </ul>
</ng-container>
<ng-template #noPatientCalls>
  No patient calls yet, let's Follow Up!
</ng-template>
