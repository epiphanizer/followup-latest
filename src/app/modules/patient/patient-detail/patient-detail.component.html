<ion-content>
  <ion-row>
    <ion-col class="left-hand-detail">
      <app-patient-call-status-controls *ngIf="selected.patientCall" [patientCall]="selected.patientCall">
      </app-patient-call-status-controls>
      <app-patient-call-start-button
        *ngIf="!selected.patientCall"
        [user]="user"
        [patient]="patient"
        (patientCallStartEventEmitter)="patientCallStartEventHandler($event)"
      >
      </app-patient-call-start-button>
      <app-patient-call-notes [patientCall]="selected.patientCall"> </app-patient-call-notes>
      <app-patient-call-questions [patientCallId]="patient.nextPatientCallId"> </app-patient-call-questions>
      <app-patient-call-stop-button
        *ngIf="selected.patientCall"
        (patientCallEndEventEmitter)="patientCallEndEventHandler($event)"
      >
      </app-patient-call-stop-button>

      <ng-container *ngIf="selected.patientCall?.patientCallStatusLabel == 'Stopped'">
        <app-patient-next-call-scheduler> </app-patient-next-call-scheduler>
        <app-patient-next-call-questions> </app-patient-next-call-questions>
        <app-patient-next-call-finish-button (click)="finishPatientCall(selected.patientCall)">
          Finish & Save
        </app-patient-next-call-finish-button>
      </ng-container>
    </ion-col>
    <ion-col class="right-hand-detail">
      <ng-container>
        <app-patient-summary-widget [operation]="operation" [patient]="patient"> </app-patient-summary-widget>
      </ng-container>
      <app-patient-notes [patient]="patient"> </app-patient-notes>
      <app-patient-call-history-listing [patient]="patient"> </app-patient-call-history-listing>
    </ion-col>
  </ion-row>
</ion-content>
