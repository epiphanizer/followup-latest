<ng-container *ngIf="patientCall">
  <ion-content>
    <ion-row>
      <ion-col class="left-hand-detail">
        <!-- <span class="current-call-status">
         {{ patientCall.patientCallStatusLabelId }}: {{ patientCall.patientCallStatusLabel }}
        </span> -->
        <app-patient-call-status-controls
          *ngIf="patientCall.patientCallStatusLabel == 'In Review'"
          [patientCall]="patientCall"
        >
        </app-patient-call-status-controls>
        <!-- Bears some documentation: this will be hidden if we have advanced past ID 2, which is the "started" state -->
        <app-patient-call-start-button
          *ngIf="patientCall.patientCallStatusLabelId < 3"
          [user]="user"
          [patientCall]="patientCall"
          (patientCallStartEventEmitter)="patientCallStartEventHandler($event)"
        >
        </app-patient-call-start-button>

        <app-patient-call-notes
          *ngIf="
            patientCall.patientCallStatusLabel == 'Started' || patientCall.patientCallStatusLabel == 'In Review';
            else spacer
          "
          [patientCall]="patientCall"
        >
        </app-patient-call-notes>
        <ng-template #spacer>
          <div class="call-notes-spacer"></div>
        </ng-template>

        <!-- Hide our questions once we are in Review or Greater -->
        <app-patient-call-questions *ngIf="patientCall.patientCallStatusLabelId < 4" [patientCall]="patientCall">
        </app-patient-call-questions>

        <app-patient-call-stop-button
          *ngIf="patientCall.patientCallStatusLabel == 'Started'"
          [patientCall]="patientCall"
          (patientCallEndEventEmitter)="patientCallEndEventHandler(patientCall)"
        >
        </app-patient-call-stop-button>

        <ng-container *ngIf="patientCall.patientCallStatusLabel == 'In Review'">
          <app-patient-next-call-scheduler> </app-patient-next-call-scheduler>
          <app-patient-next-call-questions> </app-patient-next-call-questions>
          <app-patient-next-call-finish-button (click)="finishPatientCall(patient, patientCall)">
            Finish & Save
          </app-patient-next-call-finish-button>
        </ng-container>
      </ion-col>
      <ion-col class="right-hand-detail">
        <ng-container>
          <app-patient-summary-widget [patient]="patient"> </app-patient-summary-widget>
        </ng-container>
        <app-patient-notes [patient]="patient"> </app-patient-notes>
        <app-patient-call-history-listing [patientCalls]="patient.patientCalls"> </app-patient-call-history-listing>
      </ion-col>
    </ion-row>
  </ion-content>
</ng-container>
