<ng-container class-="patient-summary-widget">
  <ion-row>
    <ion-col>
      <div class="avatar-container">
        <img *ngIf="patient.avatar; else defaultAvatar" src="{{ patient.avatar }}" />
        <ng-template #defaultAvatar>
          <img src="/assets/default-avatar-patient-detail.png" />
        </ng-template>
      </div>
    </ion-col>
    <ion-col>
      <div class="patient-info">
        <div class="patient-meta-info">
          <span class="patient-operation-name">
            {{ patient.operationName }}
          </span>
          <span class="patient-medical-record-number"> #{{ patient.patientMedicalRecordNumber }} </span>
        </div>
        <div class="patient-name">
          <h2>
            {{ patient.patientFirstName }}
            {{ patient.patientLastName }}
          </h2>
        </div>
        <div class="patient-age">Age: {{ currentYear - (patient.patientDob | slice: 0:4) }}</div>
        <div class="patient-contact-container">
          <ul class="patient-contact-list">
            <li *ngIf="patient.primaryContactPhoneNumber">
              <span class="patient-contact-number">{{ patient.primaryContactPhoneNumber }}</span>
              <span class="patient-contact-number-type">
                <!-- Check if it's a home number -->
                <ng-container *ngIf="patient.primaryContactPhoneTypeId == 1; else contactType">
                  <i class="icon-hippa"></i> Home
                </ng-container>
                <ng-template #contactType>
                  Other
                </ng-template>
              </span>
              <br />
              <a [routerLink]="'/patient/edit/' + patient.patientId + '#contacts'">[Alt Numbers]</a>
            </li>
          </ul>
        </div>
      </div>
      <a class="edit-patient-jump" [routerLink]="'/patient/edit/' + patient.patientId">
        [edit]
      </a>
    </ion-col>
  </ion-row>
</ng-container>
