<form [formGroup]="patientNextCallQuestionsForm">
  <ion-list lines="none">
    <ion-item *ngFor="let patientCallQuestion of patientCallQuestions; let idx = index">
      <ion-label position="stacked">
        <i class="icon-info"></i>
        Question for next follow-up
      </ion-label>
      <!-- needs formcontrol processing on other side-->
      <ion-textarea
        [class.is-highlighted]="patientCallQuestion.patientCallQuestionHighlight"
        placeholder="Enter your question"
      >
      </ion-textarea>
      <ion-item class="patient-next-call-question-highlight-controls ion-float-right">
        <a (click)="highlightPatientCallQuestion(patientCallQuestion)">
          <img src="/assets/highlight-flag@2x.png" />
        </a>
      </ion-item>
    </ion-item>
    <ion-item class="add-next-question" (click)="addNextCallQuestion()">
      [ + add new question ]
    </ion-item>
  </ion-list>
</form>
