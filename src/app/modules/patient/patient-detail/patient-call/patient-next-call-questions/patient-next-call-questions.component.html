<form [formGroup]="patientNextCallQuestionsForm">
  <ion-list lines="none" formArrayName="patientCallQuestions">
    <ion-item
      class="next-call-question-textarea"
      *ngFor="let patientCallQuestion of patientCallQuestions; let idx = index"
    >
      <ion-label [class.is-highlighted]="patientCallQuestion.patientCallQuestionIsHighlighted" position="stacked">
        Question for next follow-up
      </ion-label>
      <ion-textarea
        rows="2"
        [class.is-highlighted]="patientCallQuestion.patientCallQuestionIsHighlighted"
        formControlName="{{ idx }}"
        placeholder="Enter your question..."
      >
      </ion-textarea>
      <a class="highlight-flag" (click)="togglePatientCallQuestionHighlight(idx)">
        <img class="ion-float-right" src="/assets/highlight-flag@2x.png" />
      </a>
    </ion-item>
    <ion-item class="add-next-question" (click)="addNextCallQuestion()">
      [ + add new question ]
    </ion-item>
  </ion-list>
</form>
