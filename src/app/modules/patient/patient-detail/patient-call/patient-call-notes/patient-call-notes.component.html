<ng-container>
  <form [formGroup]="patientCallNotesForm">
    <ion-list lines="none" inset>
      <ion-item class="patient-call-notes" *ngIf="patientCall; else placeholder">
        <ion-label position="stacked" *ngIf="patientCall.patientCallStatusLabel == 'Started'">
          Notes
        </ion-label>
        <ion-label position="stacked" *ngIf="patientCall.patientCallStatusLabel == 'In Review'">
          Edit & Review Call
        </ion-label>
        <ion-textarea
          [class.review]="patientCall?.patientCallStatusLabel == 'In Review'"
          [class.highlighting]="highlighterActive"
          formControlName="patientCallNotes"
        ></ion-textarea>
      </ion-item>
      <ion-item *ngIf="patientCall?.patientCallStatusLabel == 'In Review'" class="patient-call-note-highlight-controls">
        <a (click)="highlightPatientCallNotes()">
          <img src="/assets/highlight-flag@2x.png" />
        </a>
      </ion-item>
    </ion-list>
  </form>
</ng-container>

<ng-template #placeholder>
  <div class="placeholder"></div>
</ng-template>
