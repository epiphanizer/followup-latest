<ng-container>
  <ion-list lines="none">
    <i class="phone-icon"></i>
    <ion-item>
      <i class="icon-phone-icon"></i>
    </ion-item>
    <ion-item
      *ngFor="let patientCall of patientCalls; let idx = index"
      [class.active]="clicked == idx + 1"
      (click)="scrollToPatientCall(idx + 1)"
    >
      {{ idx + 1 }}
    </ion-item>
  </ion-list>
</ng-container>
