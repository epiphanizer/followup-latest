<ng-container>
  <ion-list lines="none">
    <ion-item>
      <i class="icon-phone-icon"></i>
    </ion-item>
    <ion-item
      class="patient-call-history-item"
      *ngFor="let patientCall of patientCalls; let idx = index"
      [class.active]="clicked == patientCall.patientCallCount"
      (click)="scrollToPatientCall(patientCall)"
    >
      <div class="patient-count">
        {{ patientCall.patientCallCount }}
      </div>
    </ion-item>
  </ion-list>
</ng-container>
