<ng-container>
  <ion-list lines="none">
    <i class="phone-icon"></i>
    <ion-item *ngFor="let patientCall of patientCalls; let idx = index">
      <ion-button (click)="scrollToPatientCall(patientCall.patientCallId)">
        {{ idx + 1 }}
      </ion-button>
    </ion-item>
  </ion-list>
</ng-container>
