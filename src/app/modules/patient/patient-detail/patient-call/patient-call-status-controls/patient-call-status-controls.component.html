<ion-list lines="none" class="patient-call-status-legend">
  <ion-item *ngFor="let patientCallStatus of patientCallStatuses">
    <div (click)="updatePatientCallStatus(patientCall.patientCallId, patientCallStatus.patientCallStatusLabelId)">
      <i class="icon-{{ patientCallStatus.patientCallStatusLabel | lowercase }}"></i>
      <span>{{ patientCallStatus.patientCallStatusLabel }}</span>
    </div>
  </ion-item>
</ion-list>
