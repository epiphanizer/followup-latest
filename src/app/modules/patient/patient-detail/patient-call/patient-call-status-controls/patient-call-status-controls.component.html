<ion-list lines="none" class="patient-call-status-legend">
  <ion-item
    *ngFor="let patientCallStatus of patientCallStatuses"
    (click)="updatePatientCallStatus(patientCall.patientCallId, patientCallStatus.patientCallStatusLabelId)"
  >
    <div>
      <i
        class="icon-{{ patientCallStatus.patientCallStatusLabel | lowercase }}"
        [class.active]="patientCall.patientCallStatusLabelId == patientCallStatus.patientCallStatusLabelId"
      ></i>
      <span>{{ patientCallStatus.patientCallStatusLabel }}</span>
    </div>
  </ion-item>
</ion-list>
