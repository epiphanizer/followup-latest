<ng-container *ngIf="patientCalls">
  <ion-list class="patient-call-history-list" inset lines="none">
    <div class="patient-call" *ngFor="let patientCall of patientCalls; let i = index">
      <div
        id="{{ 'call-' + patientCall.patientCallCount }}"
        class="call-headline-container {{ i == 0 ? 'active' : '' }} "
      >
        <i class="icon-phone-icon"></i>
        <span class="call-number-headline"> Call {{ patientCall.patientCallCount }} </span>
      </div>

      <div class="call-question-container">
        <div *ngFor="let patientCallQuestion of patientCallQuestions; let idx = index" lines="none" inset>
          <ion-item class="ion-float-left">
            <span
              class="call-question-label"
              [class.is-highlighted]="patientCallQuestion.patientCallQuestionIsHighlighted"
            >
              {{ patientCallQuestion.patientCallQuestion }}:
            </span>
            <span class="call-question-answer-label">
              {{ patientCallQuestion | json }}
              <ng-container *ngIf="patientCallQuestion.patientCallQuestionAnswer.length; else noAnswer">
                {{ patientCallQuestion.patientCallQuestionAnswer }}
              </ng-container>
              <ng-template #noAnswer>
                N/A
              </ng-template>
            </span>
          </ion-item>
        </div>
      </div>

      <div class="patient-call-notes-container">
        <span class="call-question-label">
          Call Notes:
        </span>
        <div class="patient-call-notes">
          {{ patientCall.patientCallNotes }}
        </div>
      </div>
    </div>
  </ion-list>
</ng-container>
