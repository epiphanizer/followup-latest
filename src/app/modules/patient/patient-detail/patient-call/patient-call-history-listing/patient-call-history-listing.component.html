<ng-container *ngIf="patientCalls">
  <ion-list inset>
    <ion-item *ngFor="let patientCall of patientCalls; let i = index">
      <div class="call-headline-container {{ i == 0 ? 'active' : '' }} ">
        <i class="icon-phone-icon"></i>
        <span class="call-number-headline">Call {{ i + 1 }}</span>
      </div>
      <div class="call-question-container">
        <ion-list *ngFor="let patientQuestion of patientQuestions" lines="none" inset>
          <ion-item>
            {{ patientQuestion.patientQuestion }}
          </ion-item>
        </ion-list>
      </div>
      <div class="custom-call-question-container"></div>
      <hr class="call-history-divider" />
    </ion-item>
  </ion-list>
</ng-container>
