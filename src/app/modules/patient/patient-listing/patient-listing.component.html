<ion-content>
  <ion-row>
    <ion-col class="patient-sidebar">
      <app-patient-manager-sidebar (operationChangeEvent)="operationChangeEventHandler($event)">
      </app-patient-manager-sidebar>
    </ion-col>
    <ion-col class="patient-content-wrapper">
      <ion-row>
        <ion-title *ngIf="selected.operation">
          {{ selected.operation.operationGroupName + ' - ' + selected.operation.operationName }}
        </ion-title>
      </ion-row>
      <app-patient-patient-listing *ngIf="selected.operation" [operation]="selected.operation">
      </app-patient-patient-listing>
    </ion-col>
  </ion-row>
</ion-content>
