<h1 class="patients-listing-headline">PATIENTS</h1>
<ul class="patient-filters">
  <div class="date-filter-container">
    <li class="patient-discharge-date">
      <a [class.active]="filterBy == 'discharge-date'" (click)="sortPatientsByDischargeDate(selectedSortFlag)">Date</a>
    </li>
    <li class="ascending-descending-control">
      <i
        class="ascending-descending-control-arrow"
        [class.asc]="selectedSortFlag == 'asc'"
        [class.desc]="selectedSortFlag == 'desc'"
        (click)="toggleAscDesc()"
      >
      </i>
    </li>
  </div>
  <div class="name-filter-container">
    <li class="patient-name-filter">
      <a [class.active]="filterBy == 'patient-name'" (click)="sortPatientsByPatientName(selectedSortFlag)">
        Patient
      </a>
    </li>
    <li class="ascending-descending-control">
      <i
        class="ascending-descending-control-arrow"
        [class.asc]="selectedSortFlag == 'asc'"
        [class.desc]="selectedSortFlag == 'desc'"
        (click)="toggleAscDesc()"
      >
      </i>
    </li>
  </div>
  <li class="patient-status">
    <span>
      <a [class.active]="filterBy == 'patient-status'" (click)="sortPatientsByPatientStatus(selectedSortFlag)">
        Status
      </a>
    </span>
  </li>
  <li class="ascending-descending-control">
    <i
      class="ascending-descending-control-arrow"
      [class.asc]="selectedSortFlag == 'asc'"
      [class.desc]="selectedSortFlag == 'desc'"
      (click)="toggleAscDesc()"
    >
    </i>
  </li>
</ul>

<ion-list class="patient-patient-list" lines="none" *ngIf="patients$ | async">
  <ion-item *ngFor="let patient of pageOfItems" class="active" [routerLink]="getPatientLink(patient)">
    <div class="patient-discharge-date">
      {{ patient.patientDischargeDate | date: 'MM/dd/yy':'UTC' }}
    </div>
    <div class="patient-avatar-container">
      <app-patient-avatar [patient]="patient"> </app-patient-avatar>
    </div>

    <div class="patient-patient-information ion-float-left">
      <span class="patient-patient-name"> {{ patient.patientFirstName }} {{ patient.patientLastName }} </span>
    </div>
    <div class="patient-patient-status-container ion-float-right">
      <span class="patient-patient-status" *ngIf="patient.patientActive; else inactive">
        {{ patient.patientStatusLabel }}
      </span>
      <ng-template #inactive>
        <span class="patient-patient-status">
          Inactive
        </span>
      </ng-template>
    </div>
  </ion-item>
</ion-list>
<jw-pagination *ngIf="patientsFiltered" [items]="patientsFiltered" (changePage)="onChangePage($event)"></jw-pagination>

<ng-template #noPatients>
  Sorry! No patients exist for this operation
</ng-template>
