<h3 class="section-header">
  {{ operation?.operationName }}
</h3>
<table class="patient-filter-search">
  <tr>
    <td>
      <ion-input placeholder="Patient/Status Search" (ionInput)="searchPatients($event)"> </ion-input>
    </td>
    <td>
      <ion-icon name="search"></ion-icon>
    </td>
  </tr>
</table>

<ion-item-divider class="divider-line"></ion-item-divider>
<ul class="patient-filters ">
  <li class="ion-float-left discharge-date">
    <a [class.active]="filterBy == 'discharge-date'" (click)="sortPatientsByDischargeDate(selectedSortFlag)"
      >[Discharge Date]</a
    >
  </li>
  <li class="ion-float-left patient-filter">
    <a [class.active]="filterBy == 'patient-name'" (click)="sortPatientsByPatientName(selectedSortFlag)"
      >[Patient Name]</a
    >
  </li>
  <li class="ion-float-right">
    <span class="ascending-descending-control">
      <i
        class="ascending-descending-control-arrow"
        [class.asc]="selectedSortFlag == 'asc'"
        [class.desc]="selectedSortFlag == 'desc'"
        (click)="toggleAscDesc()"
      >
      </i>
    </span>
  </li>
  <li class="patient-status ion-float-right">
    <span>
      <a [class.active]="filterBy == 'patient-status'" (click)="sortPatientsByPatientStatus(selectedSortFlag)">
        [Status]
      </a>
    </span>
  </li>
</ul>

<ul class="patient-patient-list" *ngIf="patients$ | async">
  <li *ngFor="let patient of patientsFiltered" class="active" [routerLink]="'/patient/edit/' + patient.patientId">
    <div class="patient-discharge-date">
      {{ patient.patientDischargeDate | date: 'M/d':'UTC' }}
    </div>
    <div class="patient-avatar-container">
      <app-patient-avatar [patient]="patient"> </app-patient-avatar>
    </div>
    <div class="patient-patient-information">
      <span class="patient-patient-name ion-float-left">
        {{ patient.patientFirstName }} {{ patient.patientLastName }}
      </span>
      <span class="patient-patient-status ion-float-right"> {{ patient.patientStatusLabel }} </span>
    </div>
  </li>
</ul>

<ng-template #noPatients>
  Sorry! No patients exist for this operation
</ng-template>
