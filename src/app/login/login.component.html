<ion-content no-bounce>
  <div class="login-background"></div>
  <ion-grid no-padding>
    <ion-row justify-content-center no-padding>
      <ion-col size-sm="8" size-lg="6" size-xl="4" align-self-center no-padding>
        <div class="login-container">
          <form id="login-form" (ngSubmit)="signIn()" [formGroup]="loginForm" novalidate>
            <div class="toolbar-logo"></div>
            <ion-text class="error-span" color="danger" *ngIf="error">
              <span padding>Username or password incorrect.</span>
            </ion-text>
            <ion-list lines="none" inset>
              <ion-item>
                <ion-label color="medium" position="floating">Username</ion-label>
                <ion-input type="text" formControlName="username" autocomplete="username"></ion-input>
              </ion-item>
              <ion-text
                color="danger"
                [hidden]="loginForm.controls.username.valid || loginForm.controls.username.untouched"
              >
                <span padding>Valid username is required</span>
              </ion-text>
              <ion-item>
                <ion-label color="medium" position="floating">Password</ion-label>
                <ion-input type="password" formControlName="password" autocomplete="current-password"></ion-input>
              </ion-item>
              <ion-text
                color="danger"
                [hidden]="loginForm.controls.password.valid || loginForm.controls.password.untouched"
              >
                <span padding translate>Password is required</span>
              </ion-text>
            </ion-list>
            <div class="login-controls-container" padding-horizontal>
              <ion-button
                type="submit"
                [disabled]="loginForm.untouched"
                (submit)="signIn()"
                color="primary"
                expand="block"
              >
                Login
              </ion-button>

              <span href="#" class="welcome-back">
                [welcome back]
              </span>
            </div>
          </form>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
